name: ClipDock desktop build
on:
  push:
    paths: ['qt/**', 'CMakeLists.txt', 'scripts/**', 'run-macos.command', 'run-windows.cmd', 'run-linux.sh', '.gitattributes', '.github/workflows/qt-build.yml']
  pull_request:
    paths: ['qt/**', 'CMakeLists.txt', 'scripts/**', 'run-macos.command', 'run-windows.cmd', 'run-linux.sh', '.gitattributes', '.github/workflows/qt-build.yml']
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Create release binary archives for all platforms (no installers)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: qt-build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.build_release || false }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }} / Qt 6.8.3
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            qt_arch: win64_msvc2022_64
            artifact: ClipDock-Windows-x64
            archive: zip
          - os: macos-15
            qt_arch: clang_64
            artifact: ClipDock-macOS-arm64
            archive: zip
          - os: macos-15-intel
            qt_arch: clang_64
            artifact: ClipDock-macOS-x64
            archive: zip
          - os: ubuntu-24.04
            qt_arch: linux_gcc_64
            artifact: ClipDock-Linux-x64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    env:
      CONFIGURATION: Release
      ARTIFACT_NAME: ${{ matrix.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1-mesa-dev libglib2.0-0t64 libpulse0 libasound2t64 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libx11-xcb1 \
            libwayland-dev libwayland-client0 libwayland-cursor0 libwayland-egl1 libpipewire-0.3-0 xvfb xauth patchelf
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtmultimedia qtshadertools'
          cache: true
      - name: Build and test macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export QT_ROOT="$QT_ROOT_DIR"
          bash scripts/test-qt.sh -DCMAKE_OSX_ARCHITECTURES="$(uname -m)"
      - name: Build and test Windows app
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/build-qt.ps1 -QtRoot $env:QT_ROOT_DIR -Configuration Release -Test
      - name: Build and test Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export QT_ROOT="$QT_ROOT_DIR"
          bash scripts/test-qt.sh -G Ninja
      - name: Package macOS release binaries
        if: github.event_name == 'workflow_dispatch' && inputs.build_release && runner.os == 'macOS'
        shell: bash
        run: |
          export QT_ROOT="$QT_ROOT_DIR"
          bash scripts/package-macos.sh -DCMAKE_OSX_ARCHITECTURES="$(uname -m)"
          lipo -verify_arch "$(uname -m)" dist/qt/ClipDock.app/Contents/MacOS/ClipDock
          ditto -c -k --sequesterRsrc --keepParent dist/qt/ClipDock.app "dist/$ARTIFACT_NAME.zip"
      - name: Package Windows release binaries
        if: github.event_name == 'workflow_dispatch' && inputs.build_release && runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/build-qt.ps1 -QtRoot $env:QT_ROOT_DIR -Configuration Release -Package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/qt/* -DestinationPath "dist/$env:ARTIFACT_NAME.zip"
      - name: Package and verify Linux release binaries
        if: github.event_name == 'workflow_dispatch' && inputs.build_release && runner.os == 'Linux'
        shell: bash
        run: |
          export QT_ROOT="$QT_ROOT_DIR"
          bash scripts/package-linux.sh -G Ninja
          bash scripts/test-linux-package.sh
          tar -czf "dist/$ARTIFACT_NAME.tar.gz" -C dist/linux .
      - name: Upload release binaries
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.${{ matrix.archive }}
          compression-level: 0
          if-no-files-found: error
