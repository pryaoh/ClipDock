name: ClipDock desktop build
on:
  push:
    paths: ['qt/**', 'CMakeLists.txt', 'scripts/**', 'run-macos.command', '.gitattributes', '.github/workflows/qt-build.yml']
  pull_request:
    paths: ['qt/**', 'CMakeLists.txt', 'scripts/**', 'run-macos.command', '.gitattributes', '.github/workflows/qt-build.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Qt 6.8.3 / ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libpulse0 libasound2t64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia qtshadertools'
          cache: true
      - name: Configure
        run: cmake -S . -B build/qt -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/qt --config Release --parallel
      - name: Test
        run: ctest --test-dir build/qt -C Release --output-on-failure
